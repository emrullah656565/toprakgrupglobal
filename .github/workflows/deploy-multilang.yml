name: Publish multilingual site

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-multilang.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translation engine
        run: pip install lxml argostranslate
      - name: Install language models
        run: |
          python - <<'PY'
          import argostranslate.package
          argostranslate.package.update_package_index()
          wanted={('tr','en'),('en','fa'),('en','ar')}
          for p in argostranslate.package.get_available_packages():
              if (p.from_code,p.to_code) in wanted:
                  argostranslate.package.install_from_path(p.download())
          PY
      - name: Generate language pages
        env:
          PACKED_SCRIPT: 
        run: |
          printf '%s' "$PACKED_SCRIPT" | base64 -d | xz -d > /tmp/build_multilang.py
          python /tmp/build_multilang.py
          rm -f en/translations.json fa/translations.json ar/translations.json .translation-cache-*.json
      - name: Publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' site.js styles.css sitemap.xml en fa ar
          git commit -m "Add professional English Persian and Arabic pages" || exit 0
          git push
