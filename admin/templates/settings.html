{% extends "base.html" %}{% block content %}<div class="page-head"><div><p class="eyebrow">KURUMSAL AYARLAR</p><h1>Şirket Bilgileri</h1><p>Site genelinde kullanılan unvan ve iletişim bilgilerini güncelleyin.</p></div></div><form class="panel settings-form" method="post" action="/admin/settings"><input type="hidden" name="csrf_token" value="{{ csrf }}">{% for row in rows %}<label>{{ {'company_name':'Tam ticari unvan','phone':'Telefon','email':'E-posta','address':'Adres','site_title':'Marka adı'}.get(row[0],row[0]) }}{% if row[0]=='company_name' or row[0]=='address' %}<textarea name="setting_{{ row[0] }}" rows="3">{{ row[1] }}</textarea>{% else %}<input name="setting_{{ row[0] }}" value="{{ row[1] }}">{% endif %}</label>{% endfor %}<button class="button primary">Bilgileri kaydet</button></form>{% endblock %}
